[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-agents"
version = "0.1.0"
description = "Dispatch AI agents from mentions in an Obsidian vault"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["watchdog>=4,<7"]

[project.scripts]
vault-agents = "watcher:main"

[tool.setuptools]
py-modules = ["watcher", "vault_agents_note_runtime"]
