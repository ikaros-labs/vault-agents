[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-agents"
version = "0.1.0"
description = "Tag @hermes, @claude, or @codex inside any Obsidian note — your vault becomes an AI agent channel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nikita Melnikov"}]
keywords = ["obsidian", "ai-agents", "automation", "watcher", "markdown", "hermes", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["watchdog>=4,<7"]

[project.urls]
Homepage = "https://github.com/ikaros-labs/vault-agents"
Repository = "https://github.com/ikaros-labs/vault-agents"
Issues = "https://github.com/ikaros-labs/vault-agents/issues"

[project.scripts]
vault-agents = "watcher:main"

[tool.setuptools]
py-modules = ["watcher", "vault_agents_note_runtime"]
